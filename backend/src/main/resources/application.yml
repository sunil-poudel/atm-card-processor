spring:
  application:
    name: minicard-processor
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

app:
  business-zone: Asia/Kathmandu
  bootstrap-admin:
    email: admin@minicard.local
    password: ""
  security:
    jwt:
      secret: ""
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7
    cookie-secure: true
    cors-allowed-origins: []
  crypto:
    pan:
      current-key-id: k1
      keys:
        k1: ""
      hash-key: ""
  cards:
    bin: "990000"
    expose-pan-on-issue: false
    default-per-transaction-limit-minor: 5000000
    default-daily-limit-minor: 20000000
  fraud:
    flag-threshold: 50
    decline-threshold: 80
  disputes:
    evidence-days: 7
    max-age-days: 120
    deadline-job-cron: "0 0 * * * *"
