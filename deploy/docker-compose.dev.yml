services:
  postgres:
    image: postgres:17-alpine
    container_name: minicard-postgres-dev
    environment:
      POSTGRES_DB: minicard
      POSTGRES_USER: minicard
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicard -d minicard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata_dev:
