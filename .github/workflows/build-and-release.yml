name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Backend JAR
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests
          mv target/card-processor-*.jar ../card-processor.jar

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration production
          cd dist/frontend/browser
          tar -czf ../../../../frontend.tar.gz .

      - name: Publish Release (Rolling 'latest')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Automated Build
          body: |
            Automated build from commit ${{ github.sha }}
            - `card-processor.jar`: Spring Boot Backend
            - `frontend.tar.gz`: Pre-built Angular UI
          files: |
            card-processor.jar
            frontend.tar.gz
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
